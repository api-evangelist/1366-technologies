aid: 1366-technologies
name: 1366 Technologies
description: >-
  1366 Technologies was a Bedford, Massachusetts solar manufacturing company founded in 2008 out of
  MIT, best known for its patented Direct Wafer process — a kerfless method that casts multicrystalline
  silicon photovoltaic wafers directly from molten silicon in a mold, skipping the ingot-growing and
  wire-sawing steps that waste roughly half the silicon in conventional wafer production. The company
  raised venture funding from North Bridge Venture Partners, Polaris Partners, Hanwha, Tokuyama and
  Breakthrough Energy Ventures, and operated a demonstration line in Bedford. In June 2021 it merged
  with Dallas-based Hunt Perovskite Technologies to form CubicPV, combining Direct Wafer silicon with
  printed perovskite to pursue tandem modules; CubicPV cancelled its planned 10 GW US wafer factory in
  February 2024 and refocused on perovskite tandem development. 1366 Technologies is a materials and
  equipment manufacturer, not a software vendor: it never operated a developer program, public API,
  SDK or machine-readable API contract, and its own domain 1366tech.com has served an expired TLS
  certificate since May 2024.
